<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Google Photos Remover</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>Google Photos Remover</h1>
      <p id="status" class="status">Ready.</p>
      <button id="startBtn" class="btn btn-primary">Start</button>
      <button id="stopBtn" class="btn btn-secondary" disabled>Stop</button>
      <p class="hint">
        Works only on <strong>photos.google.com</strong>. Use at your own risk
        &mdash; deletions move items to Trash.
      </p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
